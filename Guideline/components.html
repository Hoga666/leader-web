<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-zh="Leader Design | 组件" data-i18n-en="Leader Design | Components">Leader Design | 组件</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #EC6443;
            --brand-light: #FFE5E0;
            --text-main: #1D1D1F;
            --text-secondary: #86868B;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.4);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #F5F7FA;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }
        #main-content {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.10) transparent;
        }
        #main-content::-webkit-scrollbar { width: 5px; }
        #main-content::-webkit-scrollbar-track { background: transparent; }
        #main-content::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.10); border-radius: 10px; }
        #main-content::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.20); }
        #sidebar {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.08) transparent;
        }
        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-track { background: transparent; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.08); border-radius: 10px; }
        #sidebar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.16); }
        .aura-background {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            overflow: hidden;
            background: #f4f4f4;
        }
        .aura-blob {
            position: absolute;
            filter: blur(120px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
        }
        .aura-blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #e6e6e6; animation-delay: 0s; }
        .aura-blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #e6e6e6; animation-delay: -5s; }
        .aura-blob-3 { top: 40%; left: 60%; width: 40vw; height: 40vw; background: #e6e6e6; animation-delay: -10s; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 15%) scale(1.1); }
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            border-radius: 40px;
        }
        .rounded-cat { border-radius: 40px !important; }
        .sidebar-nav-item {
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        .sidebar-nav-item.active {
            color: var(--brand-primary);
            font-weight: 600;
            border-left-color: var(--brand-primary);
            background: linear-gradient(90deg, var(--brand-light) 0%, transparent 100%);
        }
        .token-block {
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }
        .leader-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #EC6443;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            border-radius: 8px;
        }
      /* 组件卡片悬停变橙 + 右上角箭头 */
        .component-card {
            position: relative;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }
        .component-card .card-arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 20px;
            height: 20px;
            color: #C7C7CC;
            transition: all 0.3s ease;
        }
        .component-card:hover {
            border-color: var(--brand-primary);
            background: linear-gradient(135deg, rgba(236,100,67,0.08) 0%, rgba(255,255,255,0.6) 100%);
            box-shadow: 0 8px 24px rgba(236,100,67,0.15);
            transform: translateY(-2px);
        }
        .component-card:hover .card-title {
            color: var(--brand-primary);
        }
        .component-card:hover .card-arrow {
            color: var(--brand-primary);
            transform: translate(2px, -2px);
        }
    </style>
</head>

    <script>
        // ===== 语言切换 =====
        (function () {
            const langBtn = document.getElementById('lang-toggle');
            const langLabel = document.getElementById('lang-label');
            if (!langBtn) return;
            const allElements = document.querySelectorAll('[data-i18n-zh][data-i18n-en]');
            let currentLang = localStorage.getItem('leader-guideline-language') || 'zh';

            function updateLanguage(lang) {
                currentLang = lang;
                allElements.forEach(el => {
                    const text = el.getAttribute(`data-i18n-${lang}`);
                    if (!text) return;
                    if (el.children.length > 0) {
                        let replaced = false;
                        for (const node of el.childNodes) {
                            if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== '') {
                                node.textContent = text;
                                replaced = true;
                                break;
                            }
                        }
                        if (!replaced) el.innerHTML = text;
                    } else {
                        el.textContent = text;
                    }
                });
                langLabel.textContent = lang === 'zh' ? 'EN' : '中文';
                localStorage.setItem('leader-guideline-language', lang);
                document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
                document.dispatchEvent(new CustomEvent('leader-language-change', { detail: { lang } }));
                const title = document.querySelector('title');
                if (title) {
                    title.textContent = lang === 'zh' ? 'Leader Design | 组件' : 'Leader Design | Components';
                }
            }

            langBtn.addEventListener('click', () => updateLanguage(currentLang === 'zh' ? 'en' : 'zh'));
            updateLanguage(currentLang);
        })();
    </script>
